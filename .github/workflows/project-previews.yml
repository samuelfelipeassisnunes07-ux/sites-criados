name: Capturar imagens dos projetos
on:
  push:
    paths: ['.github/workflows/project-previews.yml']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ambiente de demonstração
        run: |
          php -v
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE USER 'preview'@'127.0.0.1' IDENTIFIED BY 'preview'; GRANT ALL ON sitesimesdefutbol.* TO 'preview'@'127.0.0.1';"
          cd sitesimesdefutbol
          cp .env.example .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=preview/;s/^DB_PASSWORD=.*/DB_PASSWORD=preview/;s|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|' .env
          php bin/install.php --seed --no-admin
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/store.log 2>&1 &
          cd ..
          git clone --depth 1 https://github.com/samuelfelipeassisnunes07-ux/JARVIS_APP.git /tmp/jarvis
          git clone --depth 1 https://github.com/samuelfelipeassisnunes07-ux/aula-container-docker.git /tmp/docker-site
          mysql -uroot -proot < /tmp/docker-site/mysql/init.sql
          mysql -uroot -proot -e "CREATE USER 'root'@'127.0.0.1' IDENTIFIED BY 'root'; GRANT ALL ON aeroporto.* TO 'root'@'127.0.0.1';" || true
          echo '127.0.0.1 db' | sudo tee -a /etc/hosts
          php -d display_errors=0 -S 127.0.0.1:8081 -t /tmp/docker-site/www >/tmp/catalog.log 2>&1 &
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/static.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/jarvis/project_Jarvis/web >/tmp/jarvis.log 2>&1 &
          npm install --prefix /tmp/capture playwright
          cd /tmp/capture
          npx playwright install chromium
      - name: Fotografar interfaces
        run: |
          mkdir -p previews
          cat > /tmp/capture/capture.cjs <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          (async()=>{
            const browser=await chromium.launch({args:['--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            for(const [name,url] of [
              ['santos','http://127.0.0.1:4173/site%202d/santos-fc/dist/'],
              ['hogwarts','http://127.0.0.1:4173/site%20herry%20potter/hogwarts-atlas/dist/'],
              ['simes','http://127.0.0.1:8080/'],
              ['jarvis','http://127.0.0.1:4174/'],
              ['avioes','http://127.0.0.1:8081/']
            ]){
              await page.goto(url,{waitUntil:'networkidle'});
              await page.waitForTimeout(3000);
              console.log(name,await page.title(),(await page.locator('body').innerText()).slice(0,500));
              await page.screenshot({path:path.join(process.env.GITHUB_WORKSPACE,'previews',name+'.png')});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/capture/capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: project-previews
          path: previews/
          retention-days: 1
