<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Imagem indisponível">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2c"/>
      <stop offset="1" stop-color="#128a5e"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2.5" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#dots)"/>
  <circle cx="400" cy="340" r="170" fill="#ffffff" opacity="0.12"/>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" opacity="0.85">⚽</text>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Imagem em breve</text>
  <text x="400" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.75">Simês de Fútbol</text>
</svg>
